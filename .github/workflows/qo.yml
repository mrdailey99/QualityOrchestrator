name: Quality Orchestrator (dogfood)

on:
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          generate-stubs: 'false'
