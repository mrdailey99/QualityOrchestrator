name: Quality Orchestrator (dogfood)

on:
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6

      - uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          generate-stubs: 'false'
