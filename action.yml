name: 'Quality Orchestrator'
description: 'Analyze PRs, recommend tests to run, and generate stubs for missing coverage'

branding:
  icon: 'cpu'
  color: 'purple'

inputs:
  github-token:
    description: 'GitHub token for PR access and commenting'
    required: false
    default: ${{ github.token }}
  generate-stubs:
    description: 'Embed truncated stub previews in the PR comment and write stub files (true/false)'
    required: false
    default: 'true'
  framework:
    description: 'Stub framework override: auto (per-file detection), pytest, or playwright'
    required: false
    default: 'auto'
  test-dir:
    description: 'Directory to scan for known test files — enables the "Running N of M tests" counter in the PR comment'
    required: false
    default: ''
  fail-on-high:
    description: 'Exit with a non-zero status when risk tier is HIGH — use this to block merges via required status checks'
    required: false
    default: 'false'
  comment-on-low:
    description: 'Post a PR comment even when risk tier is LOW — set false to reduce noise on routine PRs'
    required: false
    default: 'true'

outputs:
  risk-tier:
    description: 'Risk tier from the analysis: high, med, or low'
  risk-score:
    description: 'Numeric risk score from 0 to 100'

runs:
  using: composite
  steps:
    - name: Validate action path
      shell: bash
      run: |
        if [ -z "$GITHUB_ACTION_PATH" ]; then
          echo "::error::GITHUB_ACTION_PATH is not set — cannot locate Quality Orchestrator"
          exit 1
        fi
        if [ ! -d "$GITHUB_ACTION_PATH" ]; then
          echo "::error::GITHUB_ACTION_PATH does not exist: $GITHUB_ACTION_PATH"
          exit 1
        fi

    - name: Install Quality Orchestrator
      shell: bash
      run: pip install -e "$GITHUB_ACTION_PATH[action,cli]" --quiet

    - name: Discover test files
      shell: bash
      env:
        QO_TEST_DIR: ${{ inputs.test-dir }}
      run: |
        if [ -n "$QO_TEST_DIR" ]; then
          qo list-tests "$QO_TEST_DIR" > /tmp/qo_known_tests.txt
        else
          qo list-tests > /tmp/qo_known_tests.txt
        fi
        echo "Discovered $(wc -l < /tmp/qo_known_tests.txt | tr -d ' ') test file(s)"

    - name: Analyze PR
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        QO_PR_NUMBER: ${{ github.event.pull_request.number }}
        QO_REPO: ${{ github.repository }}
      run: |
        KNOWN_ARGS=()
        while IFS= read -r f; do
          [ -n "$f" ] && KNOWN_ARGS+=(--known-test-files "$f")
        done < /tmp/qo_known_tests.txt

        qo analyze \
          --pr "$QO_PR_NUMBER" \
          --repo "$QO_REPO" \
          --json \
          "${KNOWN_ARGS[@]}" > /tmp/qo_result.json

    - name: Set outputs
      shell: bash
      run: |
        TIER=$(jq -r '.tier' /tmp/qo_result.json)
        SCORE=$(jq -r '.risk_score' /tmp/qo_result.json)
        echo "risk-tier=$TIER" >> "$GITHUB_OUTPUT"
        echo "risk-score=$SCORE" >> "$GITHUB_OUTPUT"
        echo "Risk: $TIER ($SCORE/100)"

    - name: Generate PR comment
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        QO_PR_NUMBER: ${{ github.event.pull_request.number }}
        QO_REPO: ${{ github.repository }}
        QO_GENERATE_STUBS: ${{ inputs.generate-stubs }}
        QO_FRAMEWORK: ${{ inputs.framework }}
        QO_COMMENT_ON_LOW: ${{ inputs.comment-on-low }}
      run: |
        TIER=$(jq -r '.tier' /tmp/qo_result.json)
        if [ "$QO_COMMENT_ON_LOW" = "false" ] && [ "$TIER" = "low" ]; then
          echo "Risk is LOW and comment-on-low=false — skipping comment"
          touch /tmp/qo_comment.md
          exit 0
        fi

        KNOWN_ARGS=()
        while IFS= read -r f; do
          [ -n "$f" ] && KNOWN_ARGS+=(--known-test-files "$f")
        done < /tmp/qo_known_tests.txt

        STUB_ARGS=()
        [ "$QO_GENERATE_STUBS" = "true" ] && STUB_ARGS+=(--generate-stubs)

        qo analyze \
          --pr "$QO_PR_NUMBER" \
          --repo "$QO_REPO" \
          --format markdown \
          --framework "$QO_FRAMEWORK" \
          "${STUB_ARGS[@]}" \
          "${KNOWN_ARGS[@]}" > /tmp/qo_comment.md

    - name: Post or update PR comment
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        QO_PR_NUMBER: ${{ github.event.pull_request.number }}
        QO_REPO: ${{ github.repository }}
      run: |
        if [ ! -s /tmp/qo_comment.md ]; then
          echo "No comment to post"
          exit 0
        fi

        COMMENT_BODY=$(cat /tmp/qo_comment.md)

        COMMENT_ID=$(gh api "repos/$QO_REPO/issues/$QO_PR_NUMBER/comments" \
          --jq '[.[] | select(.body | contains("<!-- quality-orchestrator -->"))] | last | .id // empty')

        if [ -n "$COMMENT_ID" ]; then
          gh api "repos/$QO_REPO/issues/comments/$COMMENT_ID" -X PATCH -f "body=$COMMENT_BODY"
          echo "Updated existing comment #$COMMENT_ID"
        else
          gh api "repos/$QO_REPO/issues/$QO_PR_NUMBER/comments" -X POST -f "body=$COMMENT_BODY"
          echo "Created new PR comment"
        fi

    - name: Fail on HIGH risk
      shell: bash
      env:
        QO_FAIL_ON_HIGH: ${{ inputs.fail-on-high }}
      run: |
        TIER=$(jq -r '.tier' /tmp/qo_result.json)
        SCORE=$(jq -r '.risk_score' /tmp/qo_result.json)
        if [ "$QO_FAIL_ON_HIGH" = "true" ] && [ "$TIER" = "high" ]; then
          echo "::error::Quality Orchestrator: HIGH risk ($SCORE/100) — merge blocked by fail-on-high"
          exit 1
        fi
